name: Deploy frontend ke Netlify

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "netlify.toml"
      - ".github/workflows/netlify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & deploy ke Netlify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 900000

      - name: Frontend unit test
        run: CI=true yarn test --watchAll=false --runInBand

      - name: Build production (Netlify mode)
        env:
          CI: "true"
          GENERATE_SOURCEMAP: "false"
          # Netlify di-serve di root, bukan subpath /Loka-Kin/
          PUBLIC_URL: "/"
          # Jika kosong, frontend akan memanggil /api relatif.
          # Untuk cross-origin (Netlify → Render), isi dengan URL API, contoh:
          # https://loka-kin-api.onrender.com
          # Set di: GitHub → Settings → Secrets and variables → Actions → Variables → REACT_APP_BACKEND_URL
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
        run: yarn build

      - name: Verify build output
        run: |
          ls -lh build/index.html
          echo "Build OK — publish directory: frontend/build"

      - name: Deploy to Netlify
        # Hanya deploy jika secrets Netlify tersedia (skip untuk fork tanpa secrets)
        if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != '' }}
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: "./frontend/build"
          production-branch: main
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions — ${{ github.event.head_commit.message }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: Notice — Netlify secrets belum diset
        if: ${{ secrets.NETLIFY_AUTH_TOKEN == '' || secrets.NETLIFY_SITE_ID == '' }}
        run: |
          echo "::notice::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID belum diset — build selesai tapi tidak auto-deploy."
          echo "::notice::Cara set: Netlify → User Settings → Applications → New access token → copy sebagai NETLIFY_AUTH_TOKEN"
          echo "::notice::Site ID: Netlify → Site configuration → General → Site details → Site ID"
          echo "::notice::Set di: GitHub → Settings → Secrets and variables → Actions → Secrets"
          echo "::notice::Untuk auto-deploy tanpa GitHub Actions, aktifkan saja Netlify GitHub integration (app.netlify.com → Import project) — netlify.toml sudah siap."
