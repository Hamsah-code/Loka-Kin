# netlify.toml — Deploy frontend LOKA-Kin ke Netlify
# Frontend (React/Craco) di Netlify sebagai situs statis
# Backend (FastAPI) tetap di Render / Fly / VPS (lihat DEPLOYMENT.md & DEPLOY_NETLIFY.md)
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Monorepo: hanya build subfolder frontend
  base = "frontend"
  # Craco/React-Scripts output ke frontend/build
  publish = "build"
  # Build yang sama dengan GitHub Pages, tapi untuk Netlify root (PUBLIC_URL="/")
  command = "yarn install --frozen-lockfile --network-timeout 900000 && yarn build"

[build.environment]
  # Samakan dengan workflow GitHub Pages (Node 22)
  NODE_VERSION = "22"
  YARN_VERSION = "1.22.22"
  YARN_FLAGS = "--frozen-lockfile"
  CI = "true"
  GENERATE_SOURCEMAP = "false"
  # Penting: Netlify di-serve di root domain, bukan subpath /Loka-Kin/ seperti Pages
  PUBLIC_URL = "/"
  # Jangan aktifkan fallback preview di produksi (hanya untuk iframe Arena)
  # REACT_APP_PREVIEW_TOKEN_FALLBACK = ""  # biarkan kosong / tidak diset

# --- Headers keamanan & cache ---
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    # Dashboard tidak boleh di-cache agresif karena data dinamis
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Netlify tidak perlu CHIPS/Partitioned di frontend statis

# --- SPA fallback ---
# Semua route React Router (/, /dashboard, dll) harus ke index.html
# Kecuali file statis nyata dan fungsi Netlify (jika ada)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- (Opsional) Proxy API untuk hindari CORS ---
# Jika kamu set REACT_APP_BACKEND_URL="" (kosong), frontend akan fetch /api/* relatif.
# Netlify bisa proxy-kan ke Render agar tidak perlu CORS + cookie SameSite=None.
# Aktifkan blok ini BILA kamu ingin mode proxy (lebih simpel, tanpa ubah backend CORS):
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://loka-kin-api.onrender.com/api/:splat"
#   status = 200
#   force = true
#   headers = {X-Forwarded-Host = "your-site.netlify.app"}
#
# Catatan proxy:
# - Ganti URL di atas dengan URL Render kamu yang sebenarnya
# - Jika pakai proxy, CORS_ORIGINS di backend TIDAK perlu ditambah Netlify
# - Cookie sesi akan lewat proxy, jadi AUTH_COOKIE_SAMESITE bisa tetap "lax"
# - Untuk production proxy, pastikan backend pakai --proxy-headers --forwarded-allow-ips '*'
