# render.yaml - Render.com Blueprint
# Deploy: klik "New Blueprint" di dashboard Render, hubungkan repo ini
# Dokumentasi: https://render.com/docs/blueprint-spec

services:
  # Backend FastAPI
  - type: web
    name: loka-kin-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /docs
    envVars:
      - key: MONGO_URL
        value: mock  # Uses mongomock-motor fallback (in-memory)
      - key: DB_NAME
        value: loka_kin
      - key: PYTHON_VERSION
        value: 3.11.9

  # Frontend React (static site)
  - type: static_site
    name: loka-kin-frontend
    rootDir: frontend
    plan: free
    buildCommand: "npm install --legacy-peer-deps && npm run build"
    staticPublishPath: build
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://loka-kin-api.onrender.com  # URL backend di Render
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
